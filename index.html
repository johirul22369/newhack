    <script>
        function checkPassword() {
            const inputVal = document.getElementById('pass-input').value;
            const correctPass = "Zahirul22369";

            if (inputVal === correctPass) {
                document.getElementById('auth-modal').style.display = 'none';
                document.getElementById('vip-popup').style.display = 'block';
                startLiveUpdates();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function hidePopup() {
            document.getElementById('vip-popup').style.display = 'none';
            document.getElementById('floating-icon').style.display = 'flex';
        }

        function showPopup() {
            document.getElementById('vip-popup').style.display = 'block';
            document.getElementById('floating-icon').style.display = 'none';
        }

        function generateSignal() {
            const signals = ["BIG", "SMALL"];
            const randomSignal = signals[Math.floor(Math.random() * signals.length)];
            const randomNum = Math.floor(Math.random() * 10);
            const randomPeriod = Math.floor(1000 + Math.random() * 9000);

            document.getElementById('signal-text').innerText = randomSignal;
            document.getElementById('signal-num').innerText = randomNum;
            document.getElementById('period-val').innerText = randomPeriod;
        }

        function startLiveUpdates() {
            setInterval(() => {
                const pings = [11, 12, 13, 15, 14, 12];
                document.getElementById('ping-val').innerText = pings[Math.floor(Math.random() * pings.length)] + 'MS';
            }, 3000);
        }

        // Drag functionality (Mouse & Touch)
        const popup = document.getElementById('vip-popup');
        const header = document.getElementById('popup-header');

        let isDragging = false, startX, startY, initialX, initialY;

        header.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        header.addEventListener('touchstart', dragStart);
        document.addEventListener('touchmove', drag);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            const rect = popup.getBoundingClientRect();
            initialX = rect.left + rect.width / 2;
            initialY = rect.top + rect.height / 2;
            
            popup.style.transform = 'translate(-50%, -50%)';
            e.preventDefault();
        }

        function drag(e) {
            if (!isDragging) return;
            const currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const currentY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

            const dx = currentX - startX;
            const dy = currentY - startY;

            popup.style.left = (initialX + dx) + 'px';
            popup.style.top = (initialY + dy) + 'px';
        }

        function dragEnd() {
            isDragging = false;
        }
    </script>
