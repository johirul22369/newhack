    <script>
        function unlockApp() {

                }, 2500);
            } else {

            }
        }

        function updatePeriodAuto() {
            const now = new Date();
            const totalMinutes = now.getUTCHours() * 60 + now.getUTCMinutes() + 1;
            const periodStr = String(totalMinutes).padStart(4, '0');
            document.getElementById('period-txt').innerText = periodStr;
        }

        function nextSignal() {
            updatePeriodAuto();
            const num = Math.floor(Math.random() * 10);
            const word = num >= 5 ? "BIG" : "SMALL";
            document.getElementById('res-word').innerText = word;
            document.getElementById('res-num').innerText = num;
        }

        function minimizeBox() {
            document.getElementById('vip-box').style.display = 'none';
            document.getElementById('mini-icon').style.display = 'flex';
        }

        function restoreBox() {
            document.getElementById('mini-icon').style.display = 'none';
            document.getElementById('vip-box').style.display = 'block';
        }

        function makeDraggable(el, handle, onClickCallback) {
            let startX = 0, startY = 0, initLeft = 0, initTop = 0, moved = false;

            const onStart = (e) => {
                moved = false;
                const touch = e.type.includes('touch') ? e.touches[0] : e;
                startX = touch.clientX;
                startY = touch.clientY;
                const rect = el.getBoundingClientRect();
                initLeft = rect.left;
                initTop = rect.top;

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onEnd);
            };

            const onMove = (e) => {
                const touch = e.type.includes('touch') ? e.touches[0] : e;
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
                if (e.cancelable) e.preventDefault();
                el.style.left = (initLeft + dx) + 'px';
                el.style.top = (initTop + dy) + 'px';
            };

            const onEnd = () => {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
                if (!moved && onClickCallback) onClickCallback();
            };

            handle.addEventListener('mousedown', onStart);
            handle.addEventListener('touchstart', onStart, { passive: true });
        }

        makeDraggable(document.getElementById('vip-box'), document.getElementById('drag-handle'), null);
        makeDraggable(document.getElementById('mini-icon'), document.getElementById('mini-icon'), restoreBox);
    </script>
